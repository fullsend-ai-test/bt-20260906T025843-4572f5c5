# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: dummy
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: local-base
      source: harness/local-base.yaml
    - name: local-child
      source: harness/local-child.yaml
    - name: remote-base-child
      source: harness/remote-base-child.yaml
    - name: remote-child
      source: https://raw.githubusercontent.com/fullsend-ai-test/bt-20260906T025843-4572f5c5-base-harness-host/main/harness/remote-child.yaml#sha256=8a0afeed21cdae43eed046910fba38f8bc0b87c476da16d500af8a040f7cabb2
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://raw.githubusercontent.com/fullsend-ai-test/bt-20260906T025843-4572f5c5-base-harness-host/
create_issues:
    allow_targets:
        repos:
            - fullsend-ai-test/bt-20260906T025843-4572f5c5
            - fullsend-ai/fullsend
